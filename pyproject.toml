[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gs-pipeline"
version = "0.1.0"
description = "End-to-end known-camera pipeline for GraphDECO 3D Gaussian Splatting"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=5.1.0.95",
    "Pillow>=10.0",
    "plyfile>=1.0",
    "pytest>=9.2.0",
    "torch>=2.14.1",
    "transformers>=5.20.2",
]

[project.scripts]
gs-pipeline = "gs_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["gs_pipeline*"]

